ponse."},{"id":"endpoint","label":"HTTPEndpoint","kind":"module","layer":"fw","status":"changed","detail":"Now builds Request with send=self.send.","files":["starlette/endpoints.py"]},{"id":"request","label":"Request","kind":"module","layer":"fw","status":"changed","detail":"New send_early_hints method.","files":["starlette/requests.py"]},{"id":"base","label":"BaseHTTPMiddleware","kind":"module","layer":"mw","status":"changed","detail":"Forwards early hints straight to the server while waiting for the response start.","files":["starlette/middleware/base.py"]},{"id":"gzip","label":"GZipMiddleware","kind":"module","layer":"mw","status":"changed","detail":"Passes early_hint through untouched.","files":["starlette/middleware/gzip.py"]},{"id":"asgi","label":"ASGI server","kind":"external","layer":"server","status":"same","detail":"Must advertise the http.response.early_hint extension (e.g. Hypercorn, Granian)."}],"edges":[{"from":"handler","to":"request","label":"send_early_hints()","status":"added"},{"from":"endpoint","to":"request","label":"passes send","status":"changed"},{"from":"request","to":"base","label":"early_hint","status":"added"},{"from":"request","to":"gzip","label":"early_hint","status":"added"},{"from":"base","to":"asgi","label":"forwarded","status":"added"},{"from":"gzip","to":"asgi","label":"passed through","status":"added"}]}},"flows":[{"id":"base","title":"Through BaseHTTPMiddleware","description":"A handler sends one hint, then returns a response, behind a `BaseHTTPMiddleware`.","participants":[{"id":"handler","label":"Handler"},{"id":"mw","label":"BaseHTTPMiddleware"},{"id":"server","label":"ASGI server"}],"cases":[{"id":"ext","label":"Server supports early hints","before":[{"from":"handler","to":"mw","text":"http.response.early_hint"},{"from":"mw","to":"mw","text":"treats it as the response start","error":true},{"from":"mw","to":"server","text":"broken response","error":true}],"after":[{"from":"handler","to":"mw","text":"http.response.early_hint"},{"from":"mw","to":"server","text":"http.response.early_hint","note":"forwarded immediately, loop continues"},{"from":"handler","to":"mw","text":"http.response.start"},{"from":"mw","to":"server","text":"http.response.start"},{"from":"mw","to":"server","text":"http.response.body"}],"beforeOutcome":"Nothing sent early hints before this PR. Had one arrived, the middleware read only the first message and would have taken it as the response start (unchecked).","outcome":"The 103 goes out first, then the normal response."},{"id":"noext","label":"Server without the extension","after":[{"from":"handler","to":"handler","text":"send_early_hints() returns, nothing sent"},{"from":"handler","to":"mw","text":"http.response.start"},{"from":"mw","to":"server","text":"http.response.start"},{"from":"mw","to":"server","text":"http.response.body"}],"outcome":"Same as a request without hints: the call is a silent no-op."}]}],"decisions":[{"title":"No-op without the server extension","chose":"silently skip","over":"raising an error","why":"Handlers can call it unconditionally; only servers that advertise `http.response.early_hint` receive anything.","where":["starlette/requests.py:351"]},{"title":"Positional-only links","chose":"`link, /, *additional_links`","over":"a list argument or keywords","why":"At least one link is required by the signature itself. Each link is a full `Link` header value.","where":["starlette/requests.py:350"]},{"title":"Forward hints inside the middleware's read loop","chose":"a `while True` loop that forwards `early_hint` and keeps reading","over":"buffering them until the response starts","why":"Hints are useful only if they reach the client before the response, so they go to the server as soon as they arrive.","where":["starlette/middleware/base.py:156-165"]}],"attention":[{"tag":"Subtle","title":"BaseHTTPMiddleware now reads any number of pre-response messages","why":"The old code read one message, plus one more only if the first was a debug message. Now it loops past every `debug` and `early_hint` message until something else arrives.","step":2},{"tag":"Behaviour change","title":"`send_push_promise` now works in `HTTPEndpoint`s","why":"It's a side effect of passing `send`: before, the endpoint's Request held `empty_send`, which raises when called.","step":1}],"steps":[{"n":1,"title":"Add `send_early_hints` and give endpoint requests a send channel","why":"`Request.send_early_hints` encodes each link as latin-1 and sends one `http.response.early_hint` message, but only when the scope's extensions include it. `HTTPEndpoint.dispatch` now builds its Request with `send=self.send`, so the call can reach the server.","effect":"Function routes already had a send channel; class-based endpoints gain one.","files":[{"path":"starlette/requests.py","oldPath":"starlette/requests.py","status":"modified","add":5,"del":0,"binary":false,"hunks":[{"index":0,"header":"@@ -346,3 +346,8 @@ class Request(HTTPConnection[StateT]):","context":"class Request(HTTPConnection[StateT]):","oldStart":346,"newStart":346,"lines":[{"t":"ctx","text":"                for value in self.headers.getlist(name):","o":346,"n":346},{"t":"ctx","text":"                    raw_headers.append((name.encode(\"latin-1\"), value.encode(\"latin-1\")))","o":347,"n":347},{"t":"ctx","text":"            await self._send({\"type\": \"http.response.push\", \"path\": path, \"headers\": raw_headers})","o":348,"n":348},{"t":"add","text":"","n":349},{"t":"add","text":"    async def send_early_hints(self, link: str, /, *additional_links: str) -> None:","n":350},{"t":"add","text":"        if \"http.response.early_hint\" in self.scope.get(\"extensions\", {}):","n":351,"notes":["No extension, no message: the call returns silently"]},{"t":"add","text":"            raw_links = [value.encode(\"latin-1\") for value in (link, *additional_links)]","n":352,"notes":["ASGI wants header values as bytes"]},{"t":"add","text":"            await self._send({\"type\": \"http.response.early_hint\", \"l       var cls = m[1] ? 'tk-c' : m[2] ? 'tk-s' : m[3] ? 'tk-n' : KW.test(m[4]) ? 'tk-k' : null
      out.push(cls ? h('span', { class: cls, text: m[0] }) : document.createTextNode(m[0]))
      last = re.lastIndex
      if (m[0] === '') re.lastIndex++
    }
    if (last < text.length) out.push(document.createTextNode(text.slice(last)))
    return out
  }

  function fileView(f) {
    var STATUS = { added: ['add', 'new file'], deleted: ['del', 'deleted'], renamed: ['chg', 'renamed'], modified: ['', 'modified'] }
    var st = STATUS[f.status] || ['', f.status]
    var det = h('details', { class: 'file', open: true },
      h('summary', null, h('span', { class: 'p', title: f.path, text: f.status === 'renamed' && f.oldPath ? f.oldPath + ' → ' + f.path : f.path }),
        st[1] !== 'modified' ? h('span', { class: 'badge ' + st[0], text: st[1] }) : null,
        h('span', { class: 'plus', text: '+' + f.add }), h('span', { class: 'minus', text: '−' + f.del })))
    if (f.binary || !f.hunks.length) {
      add(det, h('div', { class: 'binary', text: f.binary ? 'Binary file: no text diff.' : 'No content changes (mode or rename only).' }))
      return det
    }
    var hash = EXT_HASH.test(f.path)
    var table = h('table', { class: 'diff' })
    var tbody = h('tbody')
    f.hunks.forEach(function (hk) {
      add(tbody, h('tr', { class: 'hh' }, h('td', { colspan: 4, text: hk.header })))
      var lines = hk.lines
      // fold long runs of unchanged lines that carry no note
      var i = 0
      while (i < lines.length) {
        var j = i
        while (j < lines.length && lines[j].t === 'ctx' && !lines[j].notes) j++
        var run = j - i
        if (run > 8) {
          var head = i === 0 ? 0 : 3, tail = j === lines.length ? 0 : 3
          for (var k = i; k < i + head; k++) addLine(tbody, lines[k], hash)
          var hiddenRows = []
          for (var k2 = i + head; k2 < j - tail; k2++) hiddenRows.push(lines[k2])
          ;(function (rows) {
            var fold = h('tr', { class: 'fold' }, h('td', { colspan: 4, text: '⋯  ' + rows.length + ' unchanged lines' }))
            fold.addEventListener('click', function () {
              var frag = document.createDocumentFragment()
              rows.forEach(function (l) { addLine(frag, l, hash) })
              fold.parentNode.replaceChild(frag, fold)
            })
            add(tbody, fold)
          })(hiddenRows)
          for (var k3 = j - tail; k3 < j; k3++) addLine(tbody, lines[k3], hash)
          i = j
        } else {
          for (var k4 = i; k4 < j; k4++) addLine(tbody, lines[k4], hash)
          if (j < lines.length) addLine(tbody, lines[j], hash)
          i = j + 1
        }
      }
    })
    add(table, tbody)
    add(det, h('div', { class: 'code' }, table))
    return det
  }
  function addLine(parent, l, hash) {
    var cls = l.t === 'add' ? 'add' : l.t === 'del' ? 'del' : ''
    var tr = h('tr', { class: cls + (l.notes ? ' has-note' : '') },
      h('td', { class: 'ln', text: l.o !== undefined ? String(l.o) : '' }),
      h('td', { class: 'ln', text: l.n !== undefined ? String(l.n) : '' }),
      h('td', { class: 'sg', text: l.t === 'add' ? '+' : l.t === 'del' ? '−' : ' ' }),
      h('td', { class: 'code-c' }, highlight(l.text, hash)))
    parent.appendChild(tr)
    arr(l.notes).forEach(function (n) {
      parent.appendChild(h('tr', { class: 'note' }, h('td', { colspan: 4 }, h('div', { class: 'note-box' }, rich(n)))))
    })
  }

  // ---------- shared ----------
  function segmented(opts, value, onChange) {
    var seg = h('div', { class: 'seg', role: 'group' })
    opts.forEach(function (o) {
      add(seg, h('button', { type: 'button', 'aria-pressed': o[0] === value ? 'true' : 'false', text: o[1], on: { click: function () {
        Array.prototype.forEach.call(seg.children, function (b) { b.setAttribute('aria-pressed', b === this ? 'true' : 'false') }, this)
        onChange(o[0])
      } } }))
    })
    return seg
  }
  function trunc(t, n) { t = String(t); return t.length > n ? t.slice(0, Math.max(1, n - 1)) + '…' : t }
  function wrap(t, width, maxLines) {
    var words = String(t).split(/\s+/), lines = [], cur = ''
    words.forEach(function (w) {
      if (!cur) cur = w
      else if ((cur + ' ' + w).length <= width) cur += ' ' + w
      else { lines.push(cur); cur = w }
    })
    if (cur) lines.push(cur)
    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] = trunc(lines[maxLines - 1] + '…', width) }
    return lines.map(function (l) { return trunc(l, width + 2) })
  }
  var tip = document.getElementById('tip')
  function showTip(ev, n) {
    setKids(tip, h('b', { text: n.label }), n.detail ? h('div', { text: n.detail }) : null,
      n.status !== 'same' ? h('div', { style: 'margin-top:3px;opacity:.8', text: cap(n.status) }) : null,
      arr(n.files).length ? h('div', { class: 'f', text: arr(n.files).join(', ') }) : null)
    tip.style.opacity = 1
    moveTip(ev)
  }
  function moveTip(ev) {
    var x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 10)
    var y = ev.clientY + 16
    if (y + tip.offsetHeight > window.innerHeight - 8) y = ev.clientY - tip.offsetHeight - 12
    tip.style.left = x + 'px'; tip.style.top = y + 'px'
  }
  function hideTip() { tip.style.opacity = 0 }
})()
</script>
</body>
